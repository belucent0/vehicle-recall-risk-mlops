[project]
name = "nhtsa-recall-risk-mlops"
version = "0.1.0"
description = "Early-warning MLOps pipeline for NHTSA vehicle recall risk."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.5.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
mlops = [
    "mlflow>=2.14.0",
    "prefect>=3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
