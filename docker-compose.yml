x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infra/airflow/Dockerfile
  image: nhtsa-recall-risk-airflow:local
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    PROJECT_ROOT: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project/src
    DATABASE_URL: postgresql://recall_user:recall_password@postgres:5432/recall_risk
    POSTGRES_DB: ${POSTGRES_DB:-recall_risk}
    POSTGRES_USER: ${POSTGRES_USER:-recall_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recall_password}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////opt/airflow/project/mlflow_airflow.db}
    MLFLOW_EXPERIMENT_NAME: nhtsa-recall-risk
    GIT_PYTHON_REFRESH: quiet
    NHTSA_RUN_ID: ${NHTSA_RUN_ID:-20260515T114046Z}
    NHTSA_DATA_AS_OF_DATE: ${NHTSA_DATA_AS_OF_DATE:-2026-05-15}
  volumes:
    - ./:/opt/airflow/project
    - ./dags:/opt/airflow/dags
    - ./logs/airflow:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    airflow-postgres:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: nhtsa-recall-risk-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recall_risk}
      POSTGRES_USER: ${POSTGRES_USER:-recall_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recall_password}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recall_user} -d ${POSTGRES_DB:-recall_risk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    image: vehicle-recall-risk-api:local
    container_name: vehicle-recall-risk-api
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://recall_user:recall_password@postgres:5432/recall_risk
      POSTGRES_DB: ${POSTGRES_DB:-recall_risk}
      POSTGRES_USER: ${POSTGRES_USER:-recall_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recall_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${API_PORT:-28000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-postgres:
    image: postgres:16
    container_name: nhtsa-recall-risk-airflow-postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: nhtsa-recall-risk-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: nhtsa-recall-risk-airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-18080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: nhtsa-recall-risk-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  airflow_postgres_data:
