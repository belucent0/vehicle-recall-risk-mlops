name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check DAG syntax
        run: python -m py_compile dags/nhtsa_collect_incremental.py dags/nhtsa_recall_risk_mvp.py

      - name: Run offline sample E2E
        run: python pipelines/run_smoke_e2e.py --run-id ci_fixture --top-k 5 --max-iter 1000

      - name: Build API Docker image
        run: docker compose build api

      - name: Load sample data into PostgreSQL
        run: |
          docker compose up -d postgres
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U recall_user -d recall_risk; then
              break
            fi
            sleep 2
          done
          docker compose exec -T postgres pg_isready -U recall_user -d recall_risk
          python pipelines/load_postgres.py --dataset smoke_test --run-id ci_fixture --apply-schema --truncate

      - name: Run API container smoke test
        run: |
          docker compose up -d api
          for i in {1..30}; do
            if curl -fsS http://localhost:28000/health/db; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:28000/health
          curl -fsS "http://localhost:28000/risk-scores/latest?limit=3"
          curl -fsS "http://localhost:28000/risk-scores/model/latest?limit=3"

      - name: Dump compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
